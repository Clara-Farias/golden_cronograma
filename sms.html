<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cronograma das integrações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style id="css">
/* Padrão Golden. Govtech — tema único claro, por escolha do kit. */
:root{
  --paper:#F6F4EC;--paper-2:#EFECE1;--card:#FCFBF6;
  --ink:#15171A;--ink-deep:#0A0B0D;--ink-2:#2A2E35;--ink-3:#5B626D;
  --gold:#E8A32A;--gold-hi:#F5C56B;--gold-deep:#8A6518;
  --line:rgba(21,23,26,.16);
  --g:#2E7D32;--y:#C8930A;--r:#B42318;--n:#8C929C;
  --disp:'Archivo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:10px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.rh .bd{font-family:var(--disp);font-weight:900;font-size:18px;letter-spacing:-.04em;color:var(--ink);text-transform:none}
.rh .bd i,h1 i{color:var(--gold);font-style:normal}
.ex{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;background:var(--ink-deep);color:var(--gold-hi);padding:3px 8px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;margin:22px 0 6px}
h1{font-family:var(--disp);font-weight:900;font-size:clamp(26px,4.6vw,38px);letter-spacing:-.035em;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:8px;font-size:13.5px;color:var(--ink-3)}
.meta b{color:var(--ink);font-weight:600}
h2{font-family:var(--disp);font-weight:800;font-size:clamp(18px,2.6vw,21px);letter-spacing:-.03em;line-height:1.15;margin:28px 0 4px;padding-top:10px;border-top:2.5px solid var(--gold);display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
h2 .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.nt{font-size:13px;color:var(--ink-3);margin-top:8px;max-width:90ch}
.nt b{color:var(--ink)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:14px}
.toolbar .msg{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.toolbar .msg.alert{color:var(--r)}
.toolbar .sp{flex:1}
button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;cursor:pointer;border:1px solid var(--ink);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:0}
button.primary{background:var(--ink-deep);color:var(--paper);border-color:var(--ink-deep)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

.tw{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:1140px}
th{background:var(--ink-deep);color:var(--paper);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;text-align:left;padding:8px 6px;font-weight:700;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:middle;color:var(--ink-2);background:var(--card)}
td.num{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-3);width:34px}
tr.grp td{background:var(--paper-2);padding:8px 6px;border-bottom:1px solid var(--ink)}
tr.grp b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
tr.grp span{font-size:13px;color:var(--ink-3);margin-left:10px}
tr.grp button{padding:3px 8px;font-size:10px;float:right}
input[type=text],input[type=date],select{font-family:var(--sans);font-size:13.5px;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:0;padding:5px 6px;width:100%}
input[type=text]:hover,input[type=date]:hover,select:hover{border-color:var(--line)}
input[type=date]{font-family:var(--mono);font-size:12px;font-weight:700;width:128px}
input::placeholder{color:var(--n)}
select{width:128px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
input[readonly],textarea[readonly]{pointer-events:none}
th.et,td.et{width:30%;min-width:300px}
textarea.et-in{display:block;font-family:var(--sans);font-size:13.5px;line-height:1.4;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:0;padding:5px 6px;width:100%;resize:none;overflow:hidden;min-height:30px}
textarea.et-in:hover{border-color:var(--line)}
textarea.et-in:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.rm{border:0;background:transparent;color:var(--ink-3);padding:4px 6px;font-size:14px;letter-spacing:0}
.rm:hover{color:var(--r)}

/* Linha do tempo dentro da tabela */
th.tl,td.tl{width:30%;min-width:300px;padding:0;position:relative}
th.tl{height:33px}
.tk{position:absolute;top:0;bottom:0;border-left:1px solid rgba(246,244,236,.25);padding:9px 0 0 4px;font-size:10px;letter-spacing:.04em;white-space:nowrap}
td.tl{height:38px;border-left:1px solid var(--ink)}
.gl{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.gb{position:absolute;top:11px;bottom:11px;min-width:4px;background:var(--c);border:1px solid var(--ink)}
.today{position:absolute;top:0;bottom:0;border-left:2px solid var(--gold);z-index:2}
th.tl .today b{position:absolute;top:2px;left:3px;font-size:9.5px;background:var(--gold);color:var(--ink-deep);padding:0 3px}
.nd{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--n)}
.nd.bad{color:var(--r)}
th.tl .hint{display:block;padding:0 8px;line-height:33px;color:var(--gold-hi)}
.I{--c:var(--ink-2)}.Y{--c:var(--y)}.G{--c:var(--g)}.R{--c:var(--r)}.N{--c:var(--n)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}
.st{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.st::before{content:"";width:9px;height:9px;border:1px solid var(--ink);background:var(--c);flex:none}
.st.today-l::before{width:0;height:12px;border:0;border-left:2px solid var(--gold)}

.check{border-left:3px solid var(--r);background:var(--paper-2);padding:10px 16px;margin-top:10px;max-width:90ch}
.check ul{margin:0 0 0 18px;display:grid;gap:3px;color:var(--ink-2);font-size:14px}
.foot{margin-top:30px;border-top:1px solid var(--ink);padding-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-3);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media print{.toolbar,.rm,tr.grp button,.guia{display:none}}
</style>
</head>

<script id="app">
(function(){
"use strict";
var MODELO=["Especificar requisitos e interface","Desenvolver (DEV)","Homologar (HML) com a SMS","Publicar em produção (PRD)"];
var STATUS=["Não iniciado","Em andamento","Concluído","Atrasado","Cancelado"];
var COR={"Não iniciado":"I","Em andamento":"Y","Concluído":"G","Atrasado":"R","Cancelado":"N"};
var KEY="cronograma-enxuto-rascunho-v1",DAY=86400000,MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var baseJSON=document.getElementById("state").textContent;
function nova(n){return {nome:n,inicio:"",fim:"",responsavel:"",status:"Não iniciado"};}
function prep(s){s.integracoes.forEach(function(it){if(!it.etapas||!it.etapas.length)it.etapas=MODELO.map(nova);});return s;}
var state=prep(JSON.parse(baseJSON));
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return String(h);}
var baseHash=hash(baseJSON),dirty=false,api=null,ro=false,saving=false,checked=false,retried=false,msg="",alertMsg=false,okStore=true;
try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);if(d&&d.base===baseHash&&d.state){state=d.state;dirty=true;msg="Alterações não salvas recuperadas";}else localStorage.removeItem(KEY);}}catch(e){okStore=false;}
function draft(){if(okStore)try{localStorage.setItem(KEY,JSON.stringify({base:baseHash,state:state}));}catch(e){okStore=false;}}
function undraft(){try{localStorage.removeItem(KEY);}catch(e){}}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function P(s){if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;var p=s.split("-");return Date.UTC(+p[0],+p[1]-1,+p[2]);}
function p2(n){return String(n).padStart(2,"0");}
function dm(t){var d=new Date(t);return p2(d.getUTCDate())+"/"+p2(d.getUTCMonth()+1);}
function dmy(t){return dm(t)+"/"+new Date(t).getUTCFullYear();}
function mes(t){var d=new Date(t);return MESES[d.getUTCMonth()]+"/"+String(d.getUTCFullYear()).slice(2);}
function hd(t){var d=new Date(t);return p2(d.getUTCDate())+" "+MESES[d.getUTCMonth()].toUpperCase()+" "+d.getUTCFullYear();}
function hoje(){var n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());}
function saved(iso){var d=new Date(iso);return (!iso||isNaN(d))?"":d.toLocaleDateString("pt-BR")+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}
function info(e){var a=P(e.inicio),b=P(e.fim);if(a==null&&b==null)return {k:"none"};if(a==null||b==null)return {k:"part"};if(b<a)return {k:"bad"};return {k:"ok",a:a,b:b,dias:Math.round((b-a)/DAY)+1};}
function todas(){var r=[];state.integracoes.forEach(function(it){r=r.concat(it.etapas);});return r;}

var scale=null;
function computeScale(){
  var ok=todas().map(info).filter(function(i){return i.k==="ok";});
  if(!ok.length){scale=null;return;}
  var min=Math.min.apply(null,ok.map(function(i){return i.a;})),max=Math.max.apply(null,ok.map(function(i){return i.b;}));
  min-=((new Date(min).getUTCDay()+6)%7)*DAY;max+=(6-(new Date(max).getUTCDay()+6)%7)*DAY;
  var span=max-min+DAY,ticks=[];
  if(span/DAY/7<=10){for(var t=min;t<=max;t+=7*DAY)ticks.push({t:t,l:dm(t)});}
  else{ticks.push({t:min,l:mes(min)});var d0=new Date(min),m=Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth()+1,1);while(m<=max){ticks.push({t:m,l:mes(m)});var dd=new Date(m);m=Date.UTC(dd.getUTCFullYear(),dd.getUTCMonth()+1,1);}}
  scale={min:min,max:max,span:span,ticks:ticks};
}
function pct(t){return ((t-scale.min)/scale.span*100).toFixed(3)+"%";}
function todayHTML(label){var t=hoje();if(!scale||t<scale.min||t>scale.max)return "";return '<div class="today" style="left:'+pct(t+DAY/2)+'">'+(label?'<b>HOJE</b>':'')+'</div>';}
function headTL(){
  if(!scale)return '<span class="hint">Preencha início e fim</span>';
  return scale.ticks.map(function(k){return '<span class="tk" style="left:'+pct(k.t)+'">'+k.l+'</span>';}).join("")+todayHTML(true);
}
function cellTL(e){
  var i=info(e),lines=scale?scale.ticks.map(function(k){return '<span class="gl" style="left:'+pct(k.t)+'"></span>';}).join(""):"";
  var inner;
  if(i.k==="ok"){var tip=e.nome+": "+dm(i.a)+" a "+dm(i.b)+". "+e.status+(e.responsavel?". "+e.responsavel:"")+".";
    inner='<div class="gb '+(COR[e.status]||"I")+'" style="left:'+pct(i.a)+';width:'+((i.b-i.a+DAY)/scale.span*100).toFixed(3)+'%" title="'+esc(tip)+'"><span class="sr">'+esc(tip)+'</span></div>';}
  else if(i.k==="bad")inner='<span class="nd bad">Fim antes do início</span>';
  else if(i.k==="part")inner='<span class="nd">Falta '+(P(e.inicio)==null?"o início":"o fim")+'</span>';
  else inner='<span class="nd">Sem datas</span>';
  return lines+todayHTML(false)+inner;
}

function shell(){
  return '<div class="wrap">'+
  '<div class="rh"><span class="bd">Golden<i>.</i></span><span id="rhd"></span><span class="ex">Interno</span></div>'+
  '<p class="eyebrow">SMS Fortaleza · IntegraSD · Integrações</p>'+
  '<h1>Cronograma das integrações<i>.</i></h1>'+
  '<div class="meta" id="meta"></div>'+
  '<div class="toolbar"><span class="msg" id="msg" role="status" aria-live="polite"></span><span class="sp"></span><button type="button" id="bd">Descartar</button><button type="button" class="primary" id="bs">Salvar</button></div>'+
  '<h2>Cronograma<span class="n" id="cnt"></span></h2>'+
  '<div class="tw"><table><thead><tr><th>Nº</th><th class="et">Etapa</th><th>Início</th><th>Fim</th><th>Responsável</th><th>Status</th><th class="tl" id="htl"></th><th><span class="sr">Ações</span></th></tr></thead><tbody id="tb"></tbody></table></div>'+
  '<div class="legend"><span class="st I">Não iniciado</span><span class="st Y">Em andamento</span><span class="st G">Concluído</span><span class="st R">Atrasado</span><span class="st N">Cancelado</span><span class="st today-l">Hoje</span></div>'+
  '<p class="nt guia"><b>Como preencher:</b> datas de início e fim em cada etapa; responsável pelo nome da pessoa (Nome · organização). Etapas sugeridas pelo modelo, a validar com a SMS. Escopo conforme o Panorama de atividades out/nov/dez. Remover esta nota antes de enviar.</p>'+
  '<h2>Pontos de atenção<span class="n">Em aberto</span></h2><div class="check"><ul id="at"></ul></div>'+
  '<div class="foot"><span>GoldenCloud · Fábrica de Software · Cronograma · IntegraSD</span><span id="ftd"></span></div></div>';
}
function renderHead(){
  var em=P(state.emitido)||hoje();
  document.getElementById("rhd").textContent="Fábrica de Software · Cronograma · "+hd(em);
  document.getElementById("ftd").textContent=hd(em).toLowerCase();
  document.getElementById("meta").innerHTML='<span>Cliente <b>SMS Fortaleza</b></span><span>Emitido <b>'+dmy(em)+'</b></span><span>Última gravação <b>'+(state.atualizadoEm?esc(saved(state.atualizadoEm)):"ainda não salvo")+'</b></span>';
}
function renderTable(){
  computeScale();
  var R=ro?" readonly":"",D=ro?" disabled":"";
  var h="";
  state.integracoes.forEach(function(it,ii){
    h+='<tr class="grp"><td colspan="8"><b>'+esc(it.nome)+'</b><span>'+esc(it.objeto)+'</span>'+(ro?'':'<button type="button" data-act="add" data-i="'+ii+'">+ Etapa</button>')+'</td></tr>';
    it.etapas.forEach(function(e,ei){
      h+='<tr data-i="'+ii+'" data-e="'+ei+'"><td class="num">'+p2(ei+1)+'</td>'+
       '<td class="et"><textarea class="et-in" data-f="nome" rows="1" aria-label="Etapa"'+R+'>'+esc(e.nome)+'</textarea></td>'+
       '<td><input type="date" data-f="inicio" value="'+esc(e.inicio)+'" aria-label="Início"'+R+'></td>'+
       '<td><input type="date" data-f="fim" value="'+esc(e.fim)+'" aria-label="Fim"'+R+'></td>'+
       '<td><input type="text" data-f="responsavel" value="'+esc(e.responsavel)+'" placeholder="A definir" aria-label="Responsável"'+R+'></td>'+
       '<td><select data-f="status" aria-label="Status"'+D+'>'+STATUS.map(function(s){return '<option'+(s===e.status?" selected":"")+'>'+s+'</option>';}).join("")+'</select></td>'+
       '<td class="tl">'+cellTL(e)+'</td>'+
       '<td>'+(ro?'':'<button type="button" class="rm" data-act="rm" aria-label="Remover etapa">×</button>')+'</td></tr>';
    });
  });
  document.getElementById("tb").innerHTML=h;
  fitAll();
  document.getElementById("htl").innerHTML=headTL();
}
function fit(t){t.style.height="auto";t.style.height=t.scrollHeight+"px";}
function fitAll(){document.querySelectorAll("textarea.et-in").forEach(fit);}
window.addEventListener("resize",fitAll);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
function refreshTL(){
  computeScale();
  document.getElementById("htl").innerHTML=headTL();
  document.querySelectorAll("tr[data-i]").forEach(function(tr){tr.querySelector("td.tl").innerHTML=cellTL(state.integracoes[+tr.dataset.i].etapas[+tr.dataset.e]);});
}
function renderInfo(){
  var all=todas(),dat=all.filter(function(e){return info(e).k==="ok";}).length,sr=all.filter(function(e){return !String(e.responsavel||"").trim();}).length;
  document.getElementById("cnt").textContent=dat+" de "+all.length+" etapas com datas";
  var it=[];if(all.length-dat)it.push((all.length-dat)+" etapas sem início e fim.");if(sr)it.push(sr+" etapas sem responsável nominal.");
  document.getElementById("at").innerHTML=it.concat(state.atencao||[]).map(function(x){return "<li>"+esc(x)+"</li>";}).join("");
}
function renderStatus(){
  var m=document.getElementById("msg"),bs=document.getElementById("bs"),bd=document.getElementById("bd"),t=msg;
  if(!t){if(ro)t="Só leitura";else if(dirty)t=api?"Alterações não salvas":(checked?"Salvamento indisponível aqui":"Alterações não salvas");else t=state.atualizadoEm?"Salvo":"Modelo em branco";}
  m.textContent=t;m.className="msg"+(alertMsg?" alert":"");
  bs.disabled=!dirty||!api||ro||saving;bs.textContent=saving?"Salvando…":"Salvar";bd.disabled=!dirty||saving;bd.hidden=ro;
}
function changed(){dirty=true;msg="";alertMsg=false;draft();renderInfo();renderStatus();}
function onInput(ev){
  if(ro)return;var el=ev.target,tr=el.closest("tr[data-i]");if(!tr||!el.dataset.f)return;
  state.integracoes[+tr.dataset.i].etapas[+tr.dataset.e][el.dataset.f]=el.value;
  if(el.tagName==="TEXTAREA")fit(el);
  refreshTL();changed();
}
function onClick(ev){
  var b=ev.target.closest("button[data-act]");if(!b||ro)return;
  if(b.dataset.act==="add"){var ii=b.dataset.i;state.integracoes[+ii].etapas.push(nova("Nova etapa"));renderTable();changed();var rows=document.querySelectorAll('tr[data-i="'+ii+'"]'),l=rows[rows.length-1];if(l){var x=l.querySelector('[data-f="nome"]');x.focus();x.select();}}
  else{var tr=b.closest("tr");state.integracoes[+tr.dataset.i].etapas.splice(+tr.dataset.e,1);renderTable();changed();}
}
var HEAD='<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Cronograma das integrações</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">\n';
function doc(st){return '<!doctype html>\n<html lang="pt-BR">\n<head>\n'+HEAD+'<style id="css">'+document.getElementById("css").textContent+'</style>\n</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="state">\n'+JSON.stringify(st).replace(/</g,"\\u003c")+'\n<\/script>\n<script id="app">'+document.getElementById("app").textContent+'<\/script>\n</body>\n</html>\n';}
function save(){
  if(!api||ro||saving||!dirty)return;saving=true;msg="";alertMsg=false;renderStatus();
  var s=JSON.parse(JSON.stringify(state));s.atualizadoEm=new Date().toISOString();var html=doc(s);undraft();
  api.publish(html).then(function(){saving=false;dirty=false;msg="Salvo. Atualizando…";renderStatus();},function(err){
    saving=false;var c=err&&err.code;
    if(c==="conflict"){msg="Outra versão foi salva antes. Recarregando";alertMsg=true;renderStatus();return;}
    draft();
    if(["not_writer","not_granted","consent_required","capability_disabled","capability_removed","not_declared"].indexOf(c)>=0){ro=true;msg="Só leitura: não é possível salvar aqui";alertMsg=true;renderTable();renderStatus();return;}
    if(c==="rate_limited"){msg="Aguarde um minuto e salve de novo";alertMsg=true;renderStatus();return;}
    if(!retried&&(c==="upstream_error"||!c)){retried=true;msg="Falha temporária. Tentando de novo…";renderStatus();setTimeout(save,800+Math.random()*800);return;}
    msg="Não foi possível salvar. Alterações mantidas neste navegador";alertMsg=true;renderStatus();
  });
}
function discard(){if(!dirty||saving)return;undraft();state=prep(JSON.parse(baseJSON));dirty=false;msg="Alterações descartadas";alertMsg=false;renderTable();renderInfo();renderStatus();}

document.getElementById("root").innerHTML=shell();
renderHead();renderTable();renderInfo();renderStatus();
var tb=document.getElementById("tb");tb.addEventListener("input",onInput);tb.addEventListener("change",onInput);tb.addEventListener("click",onClick);
document.getElementById("bs").addEventListener("click",save);document.getElementById("bd").addEventListener("click",discard);
if(window.claude&&typeof window.claude.use==="function"){window.claude.use("artifact").then(function(a){api=a;checked=true;renderStatus();},function(){checked=true;renderStatus();});}else{checked=true;renderStatus();}
})();
</script>
</body>
